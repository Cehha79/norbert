<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Logo: Norberts mobile Fußpflege">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cb8e8"/>
      <stop offset="1" stop-color="#143b66"/>
    </linearGradient>
    <linearGradient id="fuss1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ecdf2"/>
      <stop offset="1" stop-color="#1a63a8"/>
    </linearGradient>
    <linearGradient id="fuss2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa3d8"/>
      <stop offset="1" stop-color="#123f78"/>
    </linearGradient>
  </defs>

  <!-- Grundscheibe + Ring -->
  <circle cx="100" cy="100" r="90" fill="#f4f9fd"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ring)" stroke-width="8"/>

  <!-- Oberer Fuß (links, im Schritt nach vorn) -->
  <g transform="translate(79 82) rotate(-14)">
    <ellipse cx="0" cy="7" rx="16" ry="29" fill="url(#fuss1)"/>
    <circle cx="-14"  cy="-23" r="4.6" fill="url(#fuss1)"/>
    <circle cx="-6"   cy="-28.5" r="5.6" fill="url(#fuss1)"/>
    <circle cx="3"    cy="-29.5" r="5"   fill="url(#fuss1)"/>
    <circle cx="11"   cy="-26.5" r="4.2" fill="url(#fuss1)"/>
    <circle cx="16.5" cy="-21" r="3.5" fill="url(#fuss1)"/>
  </g>

  <!-- Unterer Fuß (rechts, gespiegelt) -->
  <g transform="translate(123 122) rotate(12) scale(-1 1)">
    <ellipse cx="0" cy="7" rx="16" ry="29" fill="url(#fuss2)"/>
    <circle cx="-14"  cy="-23" r="4.6" fill="url(#fuss2)"/>
    <circle cx="-6"   cy="-28.5" r="5.6" fill="url(#fuss2)"/>
    <circle cx="3"    cy="-29.5" r="5"   fill="url(#fuss2)"/>
    <circle cx="11"   cy="-26.5" r="4.2" fill="url(#fuss2)"/>
    <circle cx="16.5" cy="-21" r="3.5" fill="url(#fuss2)"/>
  </g>

  <!-- Funkeln -->
  <path d="M143 47 l2.6 6.8 6.8 2.6 -6.8 2.6 -2.6 6.8 -2.6 -6.8 -6.8 -2.6 6.8 -2.6z" fill="#c9a44f"/>
  <path d="M56 142 l2 5.2 5.2 2 -5.2 2 -2 5.2 -2 -5.2 -5.2 -2 5.2 -2z" fill="#bfe0f5"/>
</svg>
